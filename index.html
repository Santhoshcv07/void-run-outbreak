const NT=[[7,2,'MAINTENANCE CONSOLE: Containment breach, Sector C. All doors sealed. Auxiliary power offline: two fuses missing from the generator. Purge protocol armed. Keep your voice down.'],[13,5,'Deep scratches in the wall, fresh: IT HEARS YOU WALK.'],[27,9,'Research log: The subject has no eyes. It tracks vibration and sound. Crouching halves the signal. A thrown object rings like a bell.'],[22,17,'Radio scrap: Riley, if you hear this, the elevator needs Level-4 clearance. It is in Containment. Override the security terminal first.']];

 st(){ov(`<h2>SETTINGS</h2><label>Volume <input type=range min=0 max=100 value=${cfg.vol*100|0} oninput="A.v(this.value)"></label><label><input type=checkbox ${cfg.mute?'checked':''} onchange="A.m(this.checked)"> Mute</label><label><input type=checkbox ${cfg.rm?'checked':''} onchange="A.r(this.checked)"> Reduced motion (no shake, no lamp flicker)</label><button onclick=A.bk()>Back</button>`)},

 hp(){ov(`<h2>HOW TO PLAY</h2><p>WASD move · Shift sprint · Ctrl or C crouch · Mouse aims the flashlight and throws · F flashlight · E interact / take / hide · Q throw canister · R flare · H medical supplies · Esc pause.</p><p>The Listener is blind and hunts by sound. Sprinting is loud, crouching is nearly silent, a thrown canister draws it away. It sees you only in front of it, in line of sight. Hide in lockers, but not if it watched you enter. Restore power, override security, take the clearance, call the elevator.</p><button onclick=A.bk()>Back</button>`)},

const sol=(x,y)=>x<0||y<0||x>=W||y>=H||G[y][x]==1||PS.has(y*W+x)||(DM[y*W+x]&&!DM[y*W+x].o);

 for(let f=0;f<2;f++)mkT('L'+f,44,44,c=>{c.strokeStyle='#14141a';c.lineWidth=4;c.beginPath();c.moveTo(22,14);c.lineTo(36+f*4,6);c.moveTo(22,30);c.lineTo(36-f*4+4,38);c.moveTo(10,14);c.lineTo(2+f*4,8);c.moveTo(10,30);c.lineTo(2+4-f*4,36);c.stroke();c.strokeStyle='#8a8a92';c.lineWidth=1;c.beginPath();c.moveTo(36+f*4,6);c.lineTo(41+f*4,5);c.moveTo(40-f*4,38);c.lineTo(43-f*4,41);c.stroke();
  c.fillStyle='#0c0c11';c.beginPath();c.ellipse(18,22,12,8,0,0,7);c.fill();c.fillStyle='#17171d';c.beginPath();c.ellipse(30,22,7,6,0,0,7);c.fill();
  c.fillStyle='#2a1520';c.strokeStyle='#8a2a3a';c.lineWidth=1;for(const m of[1,-1]){c.beginPath();c.moveTo(27,22+m*5);c.lineTo(19,22+m*19);c.lineTo(33,22+m*8);c.closePath();c.fill();c.stroke()}
  c.fillStyle='#ff2a2a';c.fillRect(33,19,2,2);c.fillRect(33,23,2,2)})}

/* ---------- scene ---------- */
function create(){
 sc=this;cam=sc.cameras.main;I=[];DM={};CU=null;lamps=[];FL.t=0;ct=0;hb=0;genTex();
 sc.add.image(0,0,'map').setOrigin(0);
 DR.forEach((d,i)=>{const o={x:d[0],y:d[1],lock:d[2],o:S.open[i]?1:0,i,spr:sc.add.image((d[0]+.5)*T,(d[1]+.5)*T,'d'+d[2]).setDepth(3)};o.spr.setVisible(!o.o);DM[d[1]*W+d[0]]=o;I.push({k:'dr',x:(d[0]+.5)*T,y:(d[1]+.5)*T,d:o})});
 IT.forEach((t,i)=>{if(S.got[i])return;const x=(t[1]+.5)*T,y=(t[2]+.5)*T;I.push({k:'it',x,y,i,t:t[0],spr:sc.add.image(x,y,'i_'+t[0]).setDepth(2),g:sc.add.image(x,y,'gl').setTint(0xe8a63a).setBlendMode(Phaser.BlendModes.ADD).setDepth(21).setScale(.5).setAlpha(.28)})});
 NT.forEach(n=>{I.push({k:'nt',x:(n[0]+.5)*T,y:(n[1]+.5)*T,m:n[2]});sc.add.image((n[0]+.5)*T,(n[1]+.5)*T,n[0]==7?'tm':'nt').setDepth(2)});
 LK.forEach(l=>{I.push({k:'lk',x:(l[0]+.5)*T,y:(l[1]+.5)*T});sc.add.image((l[0]+.5)*T,(l[1]+.5)*T,'lk').setDepth(2)});
 sc.add.image(18.5*T,22.5*T,'gn').setDepth(2);I.push({k:'gen',x:18.5*T,y:22.5*T});
 sc.add.image(30.5*T,20.5*T,'tm').setDepth(2);I.push({k:'sec',x:30.5*T,y:20.5*T});
 sc.add.image(44*T,3.5*T,'el').setDepth(2);I.push({k:'el',x:44*T,y:3.5*T});
 LAMP.forEach(l=>{const x=(l[0]+.5)*T,y=(l[1]+.5)*T;sc.add.image(x,y,'lp').setDepth(2);const g=sc.add.image(x,y,'gl').setTint(0xff2a2a).setBlendMode(Phaser.BlendModes.ADD).setDepth(21).setScale(1.7).setAlpha(.18);lamps.push(g);
  if(!cfg.rm)sc.tweens.add({targets:g,alpha:{from:.08,to:.24},duration:300+Math.random()*900,yoyo:true,repeat:-1,delay:Math.random()*800})});
 P={x:S.px,y:S.py,a:0,hid:0,seen:0,fl:S.inv.fl?1:0,cr:0,nt:0,ex:0,pm:0,spr:sc.add.image(S.px,S.py,'P').setDepth(5)};
 const far=PW.map(w=>[w,Math.hypot((w[0]+.5)*T-P.x,(w[1]+.5)*T-P.y)]).sort((a,b)=>b[1]-a[1]).find(w=>bfs(w[0][0],w[0][1],w[0][0],w[0][1]))[0];
 L={x:(far[0]+.5)*T,y:(far[1]+.5)*T,a:0,s:'patrol',t:0,path:[],wi:0,wu:0,stun:0,cd:0,ex:0,lost:0,rp:0,lk:null,tgt:null,c:null,fr:0,ft:0,sx:0,sy:0,sk:0,spr:sc.add.image(0,0,'L0').setDepth(5)};
 DK=sc.textures.exists('dk')?sc.textures.get('dk'):sc.textures.createCanvas('dk',720,405);sc.add.image(0,0,'dk').setOrigin(0).setScrollFactor(0).setDepth(20);
 K=sc.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,SHIFT,CTRL,C,F,E,Q,R,H');
 sc.input.on('pointermove',()=>P.pm=1);
 toast('Riley Voss. Night shift. Wake up. Find a light.',4500);save()}

function near(){let b=null,bd=1e9;for(const o of I){if(P.hid&&o.k!='lk')continue;const d=Math.hypot(o.x-P.x,o.y-P.y);if(P.hid&&d>40)continue;const lim=o.k=='it'?30:o.k=='dr'?46:48;if(d<lim&&d<bd){b=o;bd=d}}CU=b}
function label(o){if(!o)return'';switch(o.k){case'it':return'E  Take '+TY[o.t][0];case'dr':return o.d.o?'':o.d.lock&&!({key:S.inv.key,pw:S.pw,ov:S.ov})[o.d.lock]?'Locked: '+({key:'needs a keycard',pw:'no power',ov:'security override required'})[o.d.lock]:'E  Open door';case'nt':return'E  Read';case'gen':return S.pw?'':'E  Insert fuses';case'sec':return'E  Use terminal';case'lk':return P.hid?'E  Leave locker':'E  Hide';case'el':return S.ex<0?'E  Call elevator':''}return''}
function opn(d,q){d.o=1;d.spr.setVisible(false);S.open[d.i]=1;if(!q){sfx('door');noise(d.x*T+16,d.y*T+16,200)}}
function act(){const o=CU;if(!o)return;
 if(o.k=='it'){S.got[o.i]=1;S.inv[o.t]++;if(o.t=='fuse')S.fu++;if(['med','bat','can','flr'].includes(o.t))S.sup++;o.spr.destroy();o.g.destroy();I.splice(I.indexOf(o),1);sfx('pick');toast('Picked up: '+TY[o.t][0]);if(o.t=='fl'){P.fl=1;toast('Flashlight on. F toggles it. Mouse aims.')}}
 else if(o.k=='dr'){const d=o.d;if(d.o)return;const ok=!d.lock||({key:S.inv.key,pw:S.pw,ov:S.ov})[d.lock];if(ok)opn(d);else{sfx('buzz');toast('Locked: '+({key:'an access keycard opens this',pw:'the sector has no power',ov:'security override required'})[d.lock])}}
 else if(o.k=='nt'){toast(o.m,7000);sfx('pick')}
 else if(o.k=='gen'){if(S.pw)return;if(S.inv.fuse<2){sfx('buzz');toast('Generator needs 2 fuses. You carry '+S.inv.fuse+'.')}else{S.pw=1;S.inv.fuse=0;S.al=25;sfx('pw');shake();toast('Auxiliary power restored. ALARM: something heard that.',5000);noise(o.x,o.y,700);hear(o.x,o.y)}}
 else if(o.k=='sec'){if(!S.pw){sfx('buzz');toast('Terminal offline. No power.')}else if(!S.ov){S.ov=1;sfx('pick');toast('OVERRIDE ACCEPTED. Containment open. Memo: "It was never the experiment. It was us, listening back."',7000)}else toast('Override already active.')}
 else if(o.k=='lk'){if(P.hid){P.hid=0;P.spr.setVisible(true);toast('You step out.')}else{P.hid=1;P.x=o.x;P.y=o.y;const d=Math.hypot(L.x-P.x,L.y-P.y);P.seen=(L.s=='chase'||L.s=='attack')&&d<320&&!ray(L.x,L.y,P.x,P.y)?1:0;toast(P.seen?'It saw you hide...':'Hidden. Hold still.')}}
 else if(o.k=='el'){if(!S.inv.clr){sfx('buzz');toast('Level-4 clearance required.')}else if(S.ex<0){S.ex=30;S.al=30;sfx('alarm');noise(o.x,o.y,900);hear(o.x,o.y);toast('Elevator arriving in 30 seconds. Hold the doors. It is coming.',5000)}}}

/* ---------- noise + Listener ---------- */
function noise(x,y,r){if(Math.hypot(L.x-x,L.y-y)+ray(x,y,L.x,L.y)*20<=r)hear(x,y)}
function hear(x,y){if(L.s=='chase'||L.s=='attack'||L.stun>0)return;const p=bfs(L.x/T|0,L.y/T|0,x/T|0,y/T|0);if(!p)return;if(L.s!='investigate')sfx('growl');L.tgt={x,y};L.path=p;L.s='investigate';L.t=0}
const setS=s=>{L.s=s;L.t=0;L.path=[]};
function go(x,y){const p=bfs(L.x/T|0,L.y/T|0,x/T|0,y/T|0);L.path=p||[];return!!p}
function follow(sp,dt){const n=L.path[0];if(!n)return true;const dx=n.x-L.x,dy=n.y-L.y,d=Math.hypot(dx,dy),nd=DM[(n.y/T|0)*W+(n.x/T|0)];if(nd&&!nd.o&&d<44)opn(nd,1);
 if(d<3){L.path.shift();return!L.path.length}const st=Math.min(sp*dt,d);L.a=Math.atan2(dy,dx);mv(L,dx/d*st,dy/d*st,9);return false}
function sees(d){if(P.hid&&!P.seen)return 0;const r=(P.fl&&S.inv.fl&&S.bat>0?340:240)*(P.cr?.6:1)*(P.hid?.5:1);if(d>r)return 0;if(d>48){let a=Math.atan2(P.y-L.y,P.x-L.x)-L.a;a=Math.atan2(Math.sin(a),Math.cos(a));if(Math.abs(a)>1)return 0}return!ray(L.x,L.y,P.x,P.y)}
function hurt(){S.hp-=25;sfx('hurt');shake();if(S.hp<=0){S.hp=0;end(0,'The Listener found you. Sound was your last mistake.')}}
function lu(dt){
 if(L.stun>0){L.stun-=dt;return}
 L.cd-=dt;L.t+=dt;const d=Math.hypot(P.x-L.x,P.y-L.y),see=sees(d),al=S.al>0?1.25:1;
 if(P.hid&&!P.seen&&d<80)L.ex+=dt;else L.ex=Math.max(0,L.ex-dt*.5);if(L.ex>1.6){P.seen=1;L.ex=0}
 L.sk+=dt;if(L.sk>1){if(L.path.length&&Math.hypot(L.x-L.sx,L.y-L.sy)<6)L.path=[];L.sx=L.x;L.sy=L.y;L.sk=0}
 if(L.s=='chase'||L.s=='attack'){
  if(see){L.lost=0;L.lk={x:P.x,y:P.y}}else L.lost+=dt;
  if(L.s=='attack'){if(L.t>.55){if(d<48&&(!P.hid||P.seen))hurt();L.cd=1.2;setS('chase')}return}
  if(L.lost>3.5){const k=L.lk;setS('recover');L.tgt=k;go(k.x,k.y);return}
  if(d<34&&L.cd<=0&&(!P.hid||P.seen)){setS('attack');return}
  L.rp-=dt;if(see&&d<150&&!ray(L.x,L.y,P.x,P.y)){L.a=Math.atan2(P.y-L.y,P.x-L.x);mv(L,Math.cos(L.a)*128*al*dt,Math.sin(L.a)*128*al*dt,9)}
  else{if(L.rp<=0||!L.path.length){L.rp=.35;go(L.lk.x,L.lk.y)}follow(128*al,dt)}return}
 if(see){S.ch++;setS('chase');L.lk={x:P.x,y:P.y};L.lost=0;sfx('roar');shake();toast('It has seen you. RUN or hide.',2200);return}
 if(L.s=='patrol'){if(L.wu>0){L.wu-=dt;L.a+=dt*.8;return}
  if(!L.path.length){for(let k=0;k<PW.length;k++){L.wi=(L.wi+1)%PW.length;const w=PW[L.wi];if(go((w[0]+.5)*T,(w[1]+.5)*T)&&L.path.length)break}if(!L.path.length)return}
  if(follow(62*al,dt))L.wu=1.5+Math.random()*1.5}
 else if(L.s=='investigate'||L.s=='recover'){if(follow(95*al,dt)){const c=L.tgt;setS('search');L.c=c}}
 else if(L.s=='search'){if(L.t>5.5){setS('patrol');return}
  if(!L.path.length){const c=L.c;go(((c.x/T|0)+(Math.random()*7|0)-3+.5)*T,((c.y/T|0)+(Math.random()*7|0)-3+.5)*T)}follow(50*al,dt)}}

/* ---------- player ---------- */
function pu(dt){
 const kd=k=>K[k].isDown;let ax=(kd('D')||kd('RIGHT')?1:0)-(kd('A')||kd('LEFT')?1:0),ay=(kd('S')||kd('DOWN')?1:0)-(kd('W')||kd('UP')?1:0);
 const m=ax||ay;if(m){const l=Math.hypot(ax,ay);ax/=l;ay/=l}
 P.cr=kd('CTRL')||kd('C');
 if(P.hid){P.spr.setVisible(false);S.st=Math.min(100,S.st+20*dt);return}
 const want=kd('SHIFT')&&m&&!P.cr;if(S.st<=0)P.ex=1;if(P.ex&&S.st>25)P.ex=0;
 if(want&&P.ex&&!P.wt){P.wt=1;toast('Out of breath.',1200)}if(!want)P.wt=0;
 const spr=want&&!P.ex,sp=P.cr?55:spr?170:100;
 if(m)mv(P,ax*sp*dt,ay*sp*dt,8);
 S.st=Math.max(0,Math.min(100,S.st+(spr?-28:m?10:20)*dt));
 P.nt-=dt;if(m&&P.nt<=0){P.nt=spr?.28:.45;noise(P.x,P.y,P.cr?45:spr?300:140);if(!P.cr)sfx('step',spr)}
 const pt=sc.input.activePointer;if(P.pm)P.a=Math.atan2(pt.y+cam.scrollY-P.y,pt.x+cam.scrollX-P.x);else if(m)P.a=Math.atan2(ay,ax);
 P.m=m}
function thr(){if(!S.inv.can||P.hid)return;S.inv.can--;let d=0,x=P.x,y=P.y,cx=Math.cos(P.a),cy=Math.sin(P.a);while(d<240&&!sol((x+cx*8)/T|0,(y+cy*8)/T|0)){x+=cx*8;y+=cy*8;d+=8}
 const c=sc.add.image(P.x,P.y,'i_can').setDepth(6);sc.tweens.add({targets:c,x,y,angle:360,duration:350,onComplete:()=>{c.destroy();sfx('clang');noise(x,y,330)}})}
function flare(){if(!S.inv.flr||P.hid)return;S.inv.flr--;FL={t:4,x:P.x,y:P.y};sfx('alarm');noise(P.x,P.y,160);
 if(Math.hypot(L.x-P.x,L.y-P.y)<230&&!ray(L.x,L.y,P.x,P.y)){L.stun=3.5;L.path=[];L.s='recover';L.tgt={x:P.x,y:P.y};toast('The Listener recoils from the flare.',2000)}}

/* ---------- main loop ---------- */
function update(t,dm){
 if(over||!K)return;const dt=Math.min(dm,50)/1000;S.t+=dt;const J=k=>Phaser.Input.Keyboard.JustDown(K[k]);
 if(J('F')&&S.inv.fl&&S.bat>0)P.fl=!P.fl;if(J('Q'))thr();if(J('R'))flare();
 if(J('H')&&S.inv.med&&S.hp<100){S.inv.med--;S.hp=Math.min(100,S.hp+35);sfx('pick');toast('Used medical supplies.')}
 pu(dt);
 if(P.fl&&S.inv.fl&&!P.hid){S.bat-=.55*dt;if(S.bat<=0){if(S.inv.bat>0){S.inv.bat--;S.bat=100;toast('Battery replaced.')}else{S.bat=0;P.fl=0;toast('Flashlight battery is dead.')}}}
 near();if(J('E'))act();
 lu(dt);
 while(S.done<8&&OB[S.done][1]()){S.done++;sfx('pick');toast('Objective complete: '+OB[S.done-1][0]);save()}
 if(S.al>0){S.al-=dt;ct-=dt;if(ct<=0){ct=1;sfx('alarm')}if(!cfg.rm)lamps.forEach(g=>g.setAlpha(.12+.25*Math.abs(Math.sin(S.t*6))))}
 if(S.ex>=0){if(S.ex>0)S.ex-=dt;else if(Math.hypot(P.x-44*T,P.y-4*T)<110){S.done=9;end(1);return}}
 const ch=L.s=='chase'||L.s=='attack',d=Math.hypot(P.x-L.x,P.y-L.y);if(ch){hb-=dt;if(hb<=0){hb=.5;sfx('thump')}}
 // render
 cam.setScroll(Math.round(Phaser.Math.Clamp(P.x-360,0,W*T-720)),Math.round(Phaser.Math.Clamp(P.y-202,0,H*T-405)));
 P.spr.setPosition(P.x,P.y).setRotation(P.a).setScale(1,1+(P.m?.07*Math.sin(S.t*14):0)).setVisible(!P.hid);
 L.ft+=dt;if(L.ft>.22){L.ft=0;L.fr^=1;L.spr.setTexture('L'+L.fr)}
 L.spr.setPosition(L.x,L.y).setRotation(L.a).setTint(ch?0xff7777:0xffffff).setAlpha(L.stun>0?.5+.5*Math.sin(S.t*30):1).setScale(L.s=='attack'?1.25:1)
  .setVisible(!ray(P.x,P.y,L.x,L.y)||d<70);
 if(FL.t>0)FL.t-=dt;
 light();hud(ch,d)}
function light(){const c=DK.getContext(),sx=cam.scrollX,sy=cam.scrollY;c.globalCompositeOperation='source-over';c.clearRect(0,0,720,405);c.fillStyle='rgba(2,4,8,.955)';c.fillRect(0,0,720,405);c.globalCompositeOperation='destination-out';
 const hole=(x,y,r,a)=>{const g=c.createRadialGradient(x-sx,y-sy,0,x-sx,y-sy,r);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x-sx,y-sy,r,0,7);c.fill()};
 hole(P.x,P.y,62,.85);LAMP.forEach(l=>hole((l[0]+.5)*T,(l[1]+.5)*T,72,.6));I.forEach(o=>{if(o.k=='it')hole(o.x,o.y,22,.5)});if(FL.t>0)hole(FL.x,FL.y,Math.min(1,FL.t)*170,1);
 if(P.fl&&S.inv.fl&&S.bat>0&&!P.hid&&!(S.bat<20&&!cfg.rm&&Math.random()<.2)){const R=260,px=P.x-sx,py=P.y-sy,g=c.createRadialGradient(px,py,10,px,py,R);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.moveTo(px,py);c.arc(px,py,R,P.a-.42,P.a+.42);c.closePath();c.fill()}
 DK.refresh()}
function hud(ch,d){
 $('bh').style.width=S.hp+'%';$('bs').style.width=S.st+'%';$('bb').style.width=(S.inv.fl?S.bat:0)+'%';const v=S.inv;
 set($('inv'),[v.key?'KEYCARD':'',v.fuse?'FUSE x'+v.fuse:'',v.clr?'CLEARANCE':'',`Med(H) ${v.med} Bat ${v.bat} Can(Q) ${v.can} Flare(R) ${v.flr}`,S.ex>0?`<b style="color:#e0302f">ELEVATOR ${Math.ceil(S.ex)}s</b>`:S.ex==0?'<b style="color:#e0302f">ELEVATOR HERE. GET IN.</b>':''].filter(Boolean).join('<br>'));
 set($('obj'),OB.map((o,i)=>`<div class="${i<S.done?'c':i==S.done?'n':'f'}">${i<S.done?'☑':i==S.done?'▶':'☐'} ${o[0]}</div>`).join(''));
 set($('pr'),label(CU));$('al').style.opacity=ch?.75:Math.max(0,(260-d)/260*.45)}
menu();
</script>
